services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-scheduler-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-discord_scheduler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-discord_scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - scheduler-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discord-scheduler-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      API_KEY: ${API_KEY:-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-discord_scheduler}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SCHEDULER_POLL_MS: ${SCHEDULER_POLL_MS:-5000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-20}
      SCHEDULER_LEASE_MS: ${SCHEDULER_LEASE_MS:-300000}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-2000}
      RETRY_MAX_DELAY_MS: ${RETRY_MAX_DELAY_MS:-60000}
      ALLOW_NON_DISCORD_WEBHOOKS: ${ALLOW_NON_DISCORD_WEBHOOKS:-false}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - scheduler-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discord-scheduler-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:4000
      API_KEY: ${API_KEY:-change-me}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - scheduler-net

volumes:
  pg_data:

networks:
  scheduler-net:
    driver: bridge
